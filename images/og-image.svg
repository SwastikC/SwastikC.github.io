<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png (1200×630). Render in a browser so the web fonts and photo load. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&amp;family=Manrope:wght@600;700&amp;display=swap');
    .name { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; letter-spacing: -3px; }
    .ital { font-style: italic; }
    .cap  { font-family: 'Manrope', sans-serif; font-weight: 700; letter-spacing: 3px; }
    .tag  { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; }
  </style>
  <defs>
    <clipPath id="photo"><rect x="800" y="80" width="320" height="400"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f7f4ee"/>

  <!-- Masthead rule -->
  <rect x="80" y="56" width="1040" height="2" fill="#17150f"/>
  <text x="80" y="40" class="cap" font-size="14" fill="#55514a">POSTDOCTORAL FELLOW · UNIVERSITÀ DEGLI STUDI DI MILANO · ERC UNVEIL</text>

  <text x="76" y="210" class="name" font-size="128" fill="#17150f">Swastik</text>
  <text x="76" y="330" class="name ital" font-size="128" fill="#1f3fd1">Chowbay<tspan fill="#17150f" font-style="normal">.</tspan></text>

  <rect x="80" y="372" width="48" height="2" fill="#17150f"/>
  <text x="146" y="379" class="cap" font-size="14" fill="#17150f">ASTROPHYSICIST · EXOPLANETS · PLANET‑FORMING DISKS</text>

  <text x="80" y="440" class="tag" font-size="28" fill="#17150f">Every atom in you was once inside a <tspan class="ital" fill="#1f3fd1">star</tspan>.</text>
  <text x="80" y="478" class="tag" font-size="28" fill="#17150f">I study the stars that make new worlds.</text>

  <image href="swastik.jpg" xlink:href="swastik.jpg" x="760" y="80" width="400" height="400" clip-path="url(#photo)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="800" y="496" width="320" height="1" fill="#17150f"/>
  <text x="800" y="520" class="cap" font-size="11" fill="#55514a">CHAMONIX, FRENCH ALPS</text>

  <rect x="80" y="560" width="1040" height="1" fill="#17150f" opacity="0.3"/>
  <text x="80" y="596" class="cap" font-size="14" fill="#1f3fd1">SWASTIKC.GITHUB.IO</text>
  <text x="1120" y="596" text-anchor="end" class="cap" font-size="14" fill="#55514a">14 PUBLICATIONS · ALMA PI · JWST CO-I</text>
</svg>
