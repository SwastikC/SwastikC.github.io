<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png (1200×630). Render in a browser so the web fonts load. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&amp;family=Inter:wght@300;600&amp;display=swap');
    .name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -4px; }
    .kick { font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 6px; }
    .tag  { font-family: 'Inter', sans-serif; font-weight: 300; }
    .meta { font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 2px; }
  </style>
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#9eeeff"/>
      <stop offset="60%" stop-color="#5fe1ff"/>
      <stop offset="100%" stop-color="#7c86ff"/>
    </linearGradient>
    <radialGradient id="neb1" cx="15%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#1e5bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="90%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#a86cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a86cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#0d1838"/>
      <stop offset="45%" stop-color="#03050d"/>
    </radialGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#c8f5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5fe1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fe1ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6fbff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5fe1ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#02030a"/>
  <rect width="1200" height="630" fill="url(#neb1)"/>
  <rect width="1200" height="630" fill="url(#neb2)"/>

  <g fill="#e4eeff">
    <circle cx="80" cy="60" r="1.1" opacity="0.8"/><circle cx="210" cy="140" r="0.8" opacity="0.6"/>
    <circle cx="330" cy="40" r="1.3" opacity="0.9"/><circle cx="470" cy="110" r="0.7" opacity="0.5"/>
    <circle cx="620" cy="30" r="1" opacity="0.7"/><circle cx="760" cy="90" r="0.9" opacity="0.6"/>
    <circle cx="900" cy="50" r="1.4" opacity="0.9"/><circle cx="1040" cy="130" r="0.8" opacity="0.6"/>
    <circle cx="1150" cy="70" r="1.1" opacity="0.8"/><circle cx="60" cy="300" r="0.9" opacity="0.6"/>
    <circle cx="1130" cy="330" r="1" opacity="0.7"/><circle cx="150" cy="420" r="0.8" opacity="0.5"/>
    <circle cx="1060" cy="250" r="0.7" opacity="0.5"/><circle cx="40" cy="180" r="1.2" opacity="0.8"/>
    <circle cx="1180" cy="200" r="0.9" opacity="0.6"/><circle cx="520" cy="200" r="0.6" opacity="0.4"/>
  </g>
  <circle cx="980" cy="190" r="1.6" fill="#ffd27a"/>
  <circle cx="250" cy="250" r="1.4" fill="#5fe1ff"/>

  <!-- Planet limb with sunrise -->
  <ellipse cx="600" cy="1650" rx="1300" ry="1130" fill="none" stroke="#5b8cff" stroke-width="40" opacity="0.35" filter="url(#glow)"/>
  <ellipse cx="600" cy="1650" rx="1300" ry="1130" fill="url(#planet)" stroke="#bff2ff" stroke-width="2"/>
  <ellipse cx="600" cy="520" rx="420" ry="5" fill="url(#streak)" filter="url(#soft)"/>
  <ellipse cx="600" cy="520" rx="80" ry="40" fill="url(#flare)"/>

  <text x="600" y="168" text-anchor="middle" class="kick" font-size="18" fill="#5fe1ff">ASTROPHYSICIST · EXOPLANETS · PLANET‑FORMING DISKS</text>
  <text x="600" y="300" text-anchor="middle" class="name" font-size="128" fill="url(#title)">Swastik Chowbay</text>
  <text x="600" y="368" text-anchor="middle" class="tag" font-size="28" fill="#e9eeff">Every atom in you was once inside a star.</text>
  <text x="600" y="406" text-anchor="middle" class="tag" font-size="28" fill="#e9eeff">I study the stars that make new worlds.</text>

  <text x="600" y="600" text-anchor="middle" class="meta" font-size="15" fill="#a4adc8">UNIVERSITÀ DEGLI STUDI DI MILANO  ·  ERC UNVEIL  ·  SWASTIKC.GITHUB.IO</text>
</svg>
